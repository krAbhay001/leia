.default: &default
  only:
    - merge_requests
    - web

.default_tag: &default_tag
  tags:
    - backend-docker-large

image: docker.phonepe.com/ci/ubuntu/jammy/jdk/openjdk/17/maven/3.9.9:latest

stages:
  - build
  - quality
  - deploy
  - merge

build_snapshot:
  stage: build
  <<: *default
  <<: *default_tag
  when: manual
  allow_failure: false
  script:
    - mvn clean package -U -DskipTests=true

merge_ready:
  stage: quality
  <<: *default
  <<: *default_tag
  when: manual
  allow_failure: false
  script:
    - mvn verify -U -Dsonar.skip=true

deploy_snapshot:
  stage: deploy
  <<: *default_tag
  only:
    - web
  when: manual
  allow_failure: false
  script:
    - "VERSION=$(mvn -U -q help:evaluate -Dexpression=project.version -DforceStdout)"
    - "NEW_VERSION=$(echo ${VERSION/SNAPSHOT/$CI_COMMIT_REF_NAME-SNAPSHOT} | tr '[:lower:]' '[:upper:]' | tr '/' '-')"
    - "mvn -U versions:set -DgenerateBackupPoms=false -DnewVersion=$NEW_VERSION"
    - "mvn -U deploy -DskipTests"
